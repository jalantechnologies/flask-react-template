name: pr-labeler

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR based on title prefix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = context.payload.pull_request.title;
            const prNumber = context.payload.pull_request.number;

            // Conventional commit types and the semver bump each implies when not breaking
            const commitTypes = [
              { type: 'feat', semverLabel: 'semver: minor' },
              { type: 'fix', semverLabel: 'semver: patch' },
              { type: 'perf', semverLabel: 'semver: patch' },
              { type: 'docs', semverLabel: null },
              { type: 'style', semverLabel: null },
              { type: 'refactor', semverLabel: null },
              { type: 'test', semverLabel: null },
              { type: 'chore', semverLabel: null },
              { type: 'build', semverLabel: null },
              { type: 'ci', semverLabel: null },
              { type: 'revert', semverLabel: null },
            ];

            // A breaking change marks the title with "!", either after the scope
            // (feat(api)!:, the Conventional Commits form) or before it (feat!(api):).
            // Breaking patterns are tested first so "feat(api)!:" is not caught by the
            // plain "feat" pattern and mislabelled minor.
            const breakingMappings = commitTypes.map(({ type }) => ({
              pattern: new RegExp(`^${type}(!(\\(.+?\\))?|(\\(.+?\\))!):`, 'i'),
              typeLabel: `type: ${type}`,
              semverLabel: 'semver: major',
            }));

            const standardMappings = commitTypes.map(({ type, semverLabel }) => ({
              pattern: new RegExp(`^${type}(\\(.+?\\))?:`, 'i'),
              typeLabel: `type: ${type}`,
              semverLabel,
            }));

            const labelMappings = [...breakingMappings, ...standardMappings];

            // Find matching prefix
            const match = labelMappings.find(mapping => mapping.pattern.test(title));

            if (!match) {
              core.setFailed(`❌ PR title does not follow conventional commit format. Expected format: type(scope): description\nValid types: ${commitTypes.map(({ type }) => type).join(', ')}\nMark a breaking change with "!": feat(api)!: remove the legacy endpoint\nExample: feat(api): add new endpoint`);
              return;
            }

            const labelsToAdd = [match.typeLabel];
            if (match.semverLabel) {
              labelsToAdd.push(match.semverLabel);
            }

            // Get existing labels on the PR
            const { data: existingLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingLabelNames = existingLabels.map(label => label.name);

            // Remove old type and semver labels if they differ
            const typeLabels = commitTypes.map(({ type }) => `type: ${type}`);
            const semverLabels = ['semver: major', 'semver: minor', 'semver: patch'];

            for (const label of existingLabelNames) {
              if ((typeLabels.includes(label) && label !== match.typeLabel) ||
                  (semverLabels.includes(label) && label !== match.semverLabel)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label,
                });
                console.log(`Removed label: ${label}`);
              }
            }

            // Add new labels
            const labelsToApply = labelsToAdd.filter(label => !existingLabelNames.includes(label));
            if (labelsToApply.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labelsToApply,
              });
              console.log(`Added labels: ${labelsToApply.join(', ')}`);
            }

            console.log(`PR #${prNumber} labeled with: ${labelsToAdd.join(', ')}`);
