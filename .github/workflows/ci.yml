name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Ensures CI workflow has minimal permissions for security
permissions:
  contents: read # Read-only access to repo contents for safer workflows
  pull-requests: write # Allow workflow to comment on, label, and update pull request as part of automation
  id-token: write # Allow OIDC tokens for secure cloud authentication

# Cancel an in-progress run when a newer commit is pushed to the same PR, so we
# don't pay for runs that are already superseded.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Detect whether a PR touches only documentation. Heavy jobs (tests, scan,
  # SonarQube, code review) are gated on this so a docs-only change doesn't run
  # the full test-and-scan pipeline. dorny/paths-filter reads the PR's file list
  # from the API on pull_request events, so this job needs no checkout.
  changes:
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      doc_only: ${{ steps.doc_only.outputs.value }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

      - name: Determine if the PR is documentation-only
        id: doc_only
        run: |
          if [[ "${{ steps.filter.outputs.docs }}" == "true" && "${{ steps.filter.outputs.code }}" != "true" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install Python dependencies
        run: pipenv install --dev --deploy

      - name: Install Node dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Check code formatting
        run: npm run fmt:check

      - name: Test PR labeler rules
        run: node .github/workflows/pr-labeler.test.js

  codereview:
    needs: changes
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && needs.changes.outputs.doc_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: codereview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      ANTHROPIC_BASE_URL: ${{ vars.CODE_REVIEW_BASE_URL }}
      ANTHROPIC_CUSTOM_HEADERS: 'x-do-key: ${{ secrets.CODE_REVIEW_API_KEY }}'
    steps:
      - name: Check review configuration
        id: config
        env:
          CODE_REVIEW_API_KEY: ${{ secrets.CODE_REVIEW_API_KEY }}
          CODE_REVIEW_BASE_URL: ${{ vars.CODE_REVIEW_BASE_URL }}
          CODE_REVIEW_MODEL: ${{ vars.CODE_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$CODE_REVIEW_API_KEY" ] || missing="$missing CODE_REVIEW_API_KEY (secret)"
          [ -n "$CODE_REVIEW_BASE_URL" ] || missing="$missing CODE_REVIEW_BASE_URL (variable)"
          [ -n "$CODE_REVIEW_MODEL" ] || missing="$missing CODE_REVIEW_MODEL (variable)"
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AI code review skipped::Not configured for this repository, so the review was skipped and this check passes. Missing:$missing. To enable it, set these under Settings -> Secrets and variables -> Actions, then re-run this job."
            {
              echo "### AI code review skipped"
              echo
              echo "This job is a no-op because the repository has no AI code review configuration."
              echo
              echo "Missing:$missing"
              echo
              echo "To enable it, add these under **Settings -> Secrets and variables -> Actions** and re-run the job."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Review configuration present."

      - name: Check the review account
        id: account_check
        if: steps.config.outputs.enabled == 'true'
        env:
          CODE_REVIEW_API_KEY: ${{ secrets.CODE_REVIEW_API_KEY }}
          CODE_REVIEW_BASE_URL: ${{ vars.CODE_REVIEW_BASE_URL }}
          CODE_REVIEW_MODEL: ${{ vars.CODE_REVIEW_MODEL }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          body_file="$(mktemp)"
          payload=$(jq -nc --arg m "$CODE_REVIEW_MODEL" \
            '{model: $m, max_tokens: 1, messages: [{role: "user", content: "ping"}]}')
          http_status=$(curl -s -o "$body_file" -w '%{http_code}' --max-time 30 \
            -X POST "$CODE_REVIEW_BASE_URL/v1/messages" \
            -H "x-do-key: $CODE_REVIEW_API_KEY" \
            -H "x-api-key: $CODE_REVIEW_API_KEY" \
            -H 'anthropic-version: 2023-06-01' \
            -H 'content-type: application/json' \
            -d "$payload") || http_status="000"
          response_snippet=$(tr '\n\r' '  ' < "$body_file" | cut -c1-300)
          rm -f "$body_file"

          marker="<!-- codereview-skipped -->"

          if [ "$http_status" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Review account is reachable, running the review."
            stale_comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1) || stale_comment_id=""
            if [ -n "$stale_comment_id" ]; then
              gh api --method DELETE "repos/$REPO/issues/comments/$stale_comment_id" >/dev/null || true
            fi
            exit 0
          fi

          if [ "$http_status" = "402" ]; then
            reason="credits"
            heading="Code review skipped: out of credit."
            detail="The DigitalOcean account that funds code review has no credit remaining. Add credit to it, then re-run this check."
          else
            reason="unavailable"
            heading="Code review skipped: gateway unreachable (HTTP $http_status)."
            detail="The code-review gateway, which routes reviews to DigitalOcean models, did not respond. Confirm the service is running, then re-run this check."
            echo "Gateway returned HTTP $http_status: $response_snippet"
          fi

          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          annotation_detail=$(printf '%s' "$detail" | tr -d '`')
          echo "::warning title=Code review skipped::$heading $annotation_detail"
          printf '**%s**\n\n%s\n' "$heading" "$detail" >> "$GITHUB_STEP_SUMMARY"

          comment_body=$(printf '%s\n\n**%s**\n\n%s\n' "$marker" "$heading" "$detail")
          comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1) || comment_id=""
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$comment_body" >/dev/null \
              || echo "::warning::Could not update the skip notice on the PR. It is still shown in the job summary."
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$comment_body" >/dev/null \
              || echo "::warning::Could not post the skip notice on the PR. It is still shown in the job summary."
          fi

      - name: Checkout code
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Restore PR review cost total
        if: steps.config.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .codereview-cost
          key: codereview-cost-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            codereview-cost-pr-${{ github.event.pull_request.number }}-

      - name: Compute review scope
        id: scope
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          stored=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
                --jq '.[] | select(.body | contains("<!-- codereview-cost -->")) | .body' \
              | grep -oE '<!-- codereview-last-sha: [0-9a-f]{7,40} -->' \
              | tail -n1 | grep -oE '[0-9a-f]{7,40}' || true)

          if [ -z "$stored" ] && [ -f .codereview-cost ]; then
            stored=$(jq -r '.last_reviewed_sha // ""' .codereview-cost)
          fi

          last_sha=""
          if [ -n "$stored" ] && git cat-file -e "${stored}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$stored" "$HEAD_SHA" 2>/dev/null; then
            last_sha="$stored"
          fi
          echo "last_sha=$last_sha" >> "$GITHUB_OUTPUT"

          if ! gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate \
                --jq '[.[] | select(.user.login == "claude[bot]")
                       | {path, line: (.line // .original_line), body}]' \
                | jq -s 'add // []' > .codereview-prior-comments.json; then
            echo '[]' > .codereview-prior-comments.json
          fi
          prior_count=$(jq 'length' .codereview-prior-comments.json)
          echo "prior_count=$prior_count" >> "$GITHUB_OUTPUT"

      - name: Code review
        id: review
        if: steps.config.outputs.enabled == 'true' && steps.account_check.outputs.ok == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@f87768c6d25f92ae6efa7175e223ef77d4cbf97f # v1.0.166
        with:
          anthropic_api_key: ${{ secrets.CODE_REVIEW_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Apply the project conventions in AGENTS.md (root and any nested AGENTS.md or CLAUDE.md
            files) as the authoritative standard for how this codebase is meant to be written, on
            top of general engineering best practice. The "Bar for what to flag" section below
            governs which violations actually rise to a blocking inline comment.

            Scope. ${{ steps.scope.outputs.last_sha != '' && format('You have already reviewed this PR up to commit {0}. Review ONLY the changes pushed since then: run `git diff {0}..HEAD` and confine your findings to lines that diff touches. Do not re-review or re-comment on code outside that range — it was reviewed and accepted on an earlier run.', steps.scope.outputs.last_sha) || 'This is the first review of this PR. Scope yourself to the full change (the base...head diff).' }}
            Do not flag pre-existing issues in unchanged code. Read surrounding files only as
            needed to judge the changes.

            ${{ steps.scope.outputs.prior_count != '0' && format('Avoid duplicates. The file .codereview-prior-comments.json lists the {0} inline comment(s) you posted on this PR on earlier runs (path, line, body). Read it with `cat .codereview-prior-comments.json`. Do not post a comment that repeats one of them, and do not contradict a decision an earlier comment already settled — if the author addressed a point a previous run raised, treat it as resolved rather than reopening it from the other side.', steps.scope.outputs.prior_count) || '' }}

            Do not review third-party or generated files: dependency directories (node_modules,
            .venv), build output (dist, build), or lockfiles (package-lock.json, Pipfile.lock).
            If a PR only bumps a dependency, comment on the manifest change, not the lockfile diff.

            Bar for what to flag. This review is a blocking merge gate, so post only findings
            that should stop a merge. Flag, in order of priority:
              - Correctness bugs: wrong logic, broken edge cases, null/empty mishandling,
                off-by-one, incorrect conditionals, race conditions.
              - Security and data-integrity issues: injection, auth/authorization gaps, leaked
                secrets or PII, unsafe queries, data loss or corruption.
              - Performance cliffs: N+1 queries, unbounded scans, a Mongo find/sort/$match pattern
                with no covering index, N network calls for N items in a render loop.
              - Architectural violations from AGENTS.md that change behaviour or coupling: importing
                another module's internal/ package instead of its public *_service.py API, business
                logic in Flask views or CLI scripts instead of the service layer, non-REST routes
                (not GET/POST/PATCH/DELETE on resource nouns), missing audit logging on
                state-changing routes, inline styles or per-page style overrides in the frontend.

            Do NOT flag style or cosmetic issues. Specifically, skip: docstring or comment length
            and phrasing, comments that restate code, naming, import ordering, formatting,
            type-annotation style, and anything a linter (mypy, pylint, eslint, remark) or
            SonarQube already enforces (this repo runs all of them, and they gate separately).
            AGENTS.md is the standard for the architectural judgments above; do not mine it for
            mechanical style rules. If a finding is only a style preference, or you are unsure it
            is a real defect, do not post it.

            For each issue, post an inline comment on the exact line by calling the
            mcp__github_inline_comment__create_inline_comment tool with confirmed: true so it
            posts immediately. Give a concrete, committable suggestion where possible. Post only
            inline comments — do not post a summary comment on the PR. If you find nothing, post
            nothing.
          claude_args: |
            --model ${{ vars.CODE_REVIEW_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(cat:*)"

      - name: Account review cost
        if: always() && steps.config.outputs.enabled == 'true' && steps.review.outputs.execution_file != ''
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODE_REVIEW_MODEL: ${{ vars.CODE_REVIEW_MODEL }}
          CODE_REVIEW_BASE_URL: ${{ vars.CODE_REVIEW_BASE_URL }}
        run: |
          set -euo pipefail

          usage=$(jq -c '
            ([.[] | select(.type == "result") | .usage // empty] | last) as $r
            | if $r != null then
                {in: ($r.input_tokens // 0), out: ($r.output_tokens // 0),
                 cread: ($r.cache_read_input_tokens // 0), cwrite: ($r.cache_creation_input_tokens // 0)}
              else
                ([.[] | select(.type == "assistant") | select(.message.usage != null)
                  | {id: .message.id, u: .message.usage}] | unique_by(.id) | map(.u)) as $au
                | {in: ([$au[].input_tokens // 0] | add // 0), out: ([$au[].output_tokens // 0] | add // 0),
                   cread: ([$au[].cache_read_input_tokens // 0] | add // 0), cwrite: ([$au[].cache_creation_input_tokens // 0] | add // 0)}
              end' "$EXECUTION_FILE")
          run_in=$(printf '%s' "$usage" | jq -r '.in')
          run_out=$(printf '%s' "$usage" | jq -r '.out')
          run_cache_read=$(printf '%s' "$usage" | jq -r '.cread')
          run_cache_write=$(printf '%s' "$usage" | jq -r '.cwrite')

          if [ "$run_in" = "0" ] && [ "$run_out" = "0" ] && [ "$run_cache_read" = "0" ] && [ "$run_cache_write" = "0" ]; then
            echo "::warning title=Review cost incomplete::The review ran but its transcript reported no token usage, so this run is counted as \$0 and the PR total may under-report actual spend."
          fi

          catalog=$(curl -sf --max-time 15 "$CODE_REVIEW_BASE_URL/v1/model/info") || catalog=""
          if [ -z "$catalog" ]; then
            in_price=0; out_price=0; cache_price=0
            echo "::warning title=Review cost unavailable::Couldn't reach code-review-gateway ($CODE_REVIEW_BASE_URL) to fetch prices — cost shows \$0. The review still ran. Check it's up and CODE_REVIEW_BASE_URL is correct, then re-run."
          else
            entry=$(printf '%s' "$catalog" | jq -c --arg m "$CODE_REVIEW_MODEL" \
                '[.data[] | select(.model_name==$m)][0] // empty' 2>/dev/null || true)
            if [ -z "$entry" ]; then
              in_price=0; out_price=0; cache_price=0
              available=$(printf '%s' "$catalog" | jq -r '[.data[].model_name] | unique | join(", ")' 2>/dev/null)
              echo "::warning title=Review cost unavailable::code-review-gateway has no price for \"$CODE_REVIEW_MODEL\" — cost shows \$0. The review still ran. Set CODE_REVIEW_MODEL to a priced model ($available) or add it to code-review-gateway."
            else
              price_json=$(printf '%s' "$entry" | jq -c \
                  '.model_info
                   | {in:(.input_cost_per_token//0), out:(.output_cost_per_token//0),
                      cache:(.cache_read_input_token_cost//0)}')
              in_price=$(jq -rn --argjson p "$price_json" '$p.in  * 1000000')
              out_price=$(jq -rn --argjson p "$price_json" '$p.out * 1000000')
              cache_price=$(jq -rn --argjson p "$price_json" '$p.cache * 1000000')
            fi
          fi

          run_cost=$(jq -rn \
            --argjson in "$run_in" --argjson out "$run_out" \
            --argjson cread "$run_cache_read" --argjson cwrite "$run_cache_write" \
            --argjson pin "$in_price" --argjson pout "$out_price" --argjson pcache "$cache_price" \
            '(($in * $pin) + ($out * $pout) + (($cread + $cwrite) * $pcache)) / 1000000')

          note=""
          if [ "$run_in" = "0" ] && [ "$run_out" = "0" ] && [ "$run_cache_read" = "0" ] && [ "$run_cache_write" = "0" ]; then
            note="token usage was not reported by the review transcript"
          elif [ "$in_price" = "0" ] && [ "$out_price" = "0" ] && [ "$cache_price" = "0" ]; then
            note="gateway price unavailable"
          fi

          if [ ! -s .codereview-cost ] || ! jq -e . .codereview-cost >/dev/null 2>&1; then
            echo '{"entries":[]}' > .codereview-cost
          fi

          jq \
            --arg sha "$HEAD_SHA" \
            --arg note "$note" \
            --argjson cost "$run_cost" \
            --argjson in "$run_in" \
            --argjson out "$run_out" \
            --argjson cread "$run_cache_read" \
            --argjson cwrite "$run_cache_write" \
            '{last_reviewed_sha: $sha,
              entries: ((.entries | map(select(.sha != $sha))) + [{
              sha: $sha, cost: $cost, note: $note, input_tokens: $in, output_tokens: $out,
              cache_read_input_tokens: $cread, cache_creation_input_tokens: $cwrite
            }])}' \
            .codereview-cost > .codereview-cost.new
          mv .codereview-cost.new .codereview-cost

          marker="<!-- codereview-cost -->"
          body=$(jq -r --arg marker "$marker" '
            .entries as $e
            | ($e | length) as $n
            | ($e | map(.cost // 0) | add // 0) as $tcost
            | ($e | map(.input_tokens) | add // 0) as $tin
            | ($e | map(.output_tokens) | add // 0) as $tout
            | ($e | map(.cache_read_input_tokens) | add // 0) as $tcread
            | ($e | map(.cache_creation_input_tokens) | add // 0) as $tcwrite
            | ($e | map(select((.note // "") != ""))) as $bad
            | ($bad | length) as $nbad
            | (if $nbad > 0 then
                 ["> [!WARNING]",
                  "> **This total is understated.** \($nbad) of \($n) review(s) could not be fully priced and show as $0, so the real cost is higher than below:"]
                 + ($bad | map("> - `\(.sha[0:7])` — \(.note)"))
                 + [">", "> This is usually a transient reporting gap; a later review typically shows a full figure.", ""]
               else [] end) as $warn
            | [
                $marker,
                "<!-- codereview-last-sha: \(.last_reviewed_sha // "") -->",
                "### AI code review cost (PR total)",
                "",
                "Across **\($n)** review(s) on this PR. Estimated from DigitalOcean'"'"'s published per-token pricing for the configured model, not an authoritative bill.",
                ""
              ]
              + $warn
              + [
                "| Metric | Total |",
                "| --- | --- |",
                "| Cost (USD est.) | $\($tcost * 10000 | round / 10000) |",
                "| Input tokens | \($tin) |",
                "| Output tokens | \($tout) |",
                "| Cache read tokens | \($tcread) |",
                "| Cache write tokens | \($tcwrite) |",
                "",
                "<details><summary>Per-commit breakdown</summary>",
                "",
                "| Commit | Cost (USD est.) | Input | Output | Cache read | Cache write |",
                "| --- | --- | --- | --- | --- | --- |"
              ]
              + ($e | map((if (.note // "") != "" then "⚠️ $" else "$" end) as $pfx | "| `\(.sha[0:7])` | \($pfx)\((.cost // 0) * 10000 | round / 10000) | \(.input_tokens) | \(.output_tokens) | \(.cache_read_input_tokens) | \(.cache_creation_input_tokens) |"))
              + ["", "</details>"]
              | join("\n")
          ' .codereview-cost)

          comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1) || comment_id=""
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body" >/dev/null \
              || echo "::warning::Cost comment update failed (transient); cache holds the total, next run refreshes it."
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null \
              || echo "::warning::Cost comment create failed (transient); cache holds the total, next run refreshes it."
          fi

      - name: Save PR review cost total
        if: always() && steps.config.outputs.enabled == 'true' && steps.review.outputs.execution_file != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .codereview-cost
          key: codereview-cost-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Detect workflow file changes
        id: workflow_changes
        if: always() && steps.config.outputs.enabled == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 --quiet
          if git diff --name-only "origin/$BASE_REF" HEAD | grep -q '^\.github/workflows/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if the review posted findings
        if: always() && steps.config.outputs.enabled == 'true'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          WORKFLOW_CHANGED: ${{ steps.workflow_changes.outputs.changed }}
          ACCOUNT_CHECK_OK: ${{ steps.account_check.outputs.ok }}
          ACCOUNT_CHECK_REASON: ${{ steps.account_check.outputs.reason }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = process.env.EXECUTION_FILE;

          if (process.env.ACCOUNT_CHECK_OK !== "true") {
            console.log(
              "Code review was skipped. See the pull request for why. This check passes so it " +
                "does not block the merge.",
            );
            process.exit(0);
          }

          if (!path || !fs.existsSync(path)) {
            if (process.env.WORKFLOW_CHANGED === "true") {
              console.log(
                "Review did not run because this PR edits a workflow file — the action " +
                  "only validates against the workflow on main. This is expected and " +
                  "resolves once the PR merges. Passing the gate.",
              );
              process.exit(0);
            }
            console.log(
              "Review produced no transcript and this PR does not change any workflow file, " +
                "so the review could not complete (API error or crash). Re-run the job; if it " +
                "keeps failing, check the Code review step logs. Failing the gate.",
            );
            process.exit(1);
          }

          const turns = JSON.parse(fs.readFileSync(path, "utf-8"));

          const errored = new Map();
          for (const turn of turns) {
            for (const item of turn?.message?.content ?? []) {
              if (item.type === "tool_result" && item.tool_use_id) {
                errored.set(item.tool_use_id, item.is_error === true);
              }
            }
          }

          let findings = 0;
          for (const turn of turns) {
            for (const item of turn?.message?.content ?? []) {
              if (
                item.type === "tool_use" &&
                typeof item.name === "string" &&
                item.name.endsWith("create_inline_comment") &&
                errored.get(item.id) !== true
              ) {
                findings++;
              }
            }
          }

          if (findings > 0) {
            console.log(
              `Code review posted ${findings} inline finding(s). Address them, then push to re-trigger the review.`,
            );
            process.exit(1);
          }

          const result = [...turns].reverse().find((t) => t.type === "result");
          if (result && result.is_error === true) {
            const heading = "Code review skipped: the review did not complete.";
            const detail =
              "Re-run this check; if the problem persists, check the code-review gateway, which routes reviews to DigitalOcean models.";
            console.log(`::warning title=Code review skipped::${heading} ${detail.replace(/`/g, "")}`);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `**${heading}**\n\n${detail}\n`);
            }
            const marker = "<!-- codereview-skipped -->";
            const comment_body = `${marker}\n\n**${heading}**\n\n${detail}\n`;
            const repo = process.env.REPO;
            const pr = process.env.PR_NUMBER;
            try {
              const { execFileSync } = require("child_process");
              const existing_comment_id = execFileSync(
                "gh",
                ["api", `repos/${repo}/issues/${pr}/comments`, "--paginate",
                  "--jq", `.[] | select(.body | contains("${marker}")) | .id`],
                { encoding: "utf-8" },
              )
                .split("\n")
                .filter(Boolean)[0];
              if (existing_comment_id) {
                execFileSync("gh", ["api", "--method", "PATCH",
                  `repos/${repo}/issues/comments/${existing_comment_id}`, "-f", `body=${comment_body}`],
                  { stdio: "ignore" });
              } else {
                execFileSync("gh", ["api", "--method", "POST",
                  `repos/${repo}/issues/${pr}/comments`, "-f", `body=${comment_body}`],
                  { stdio: "ignore" });
              }
            } catch (e) {
              console.log(
                "::warning::Could not post the skip notice on the PR. It is still shown in the job summary.",
              );
            }
            process.exit(0);
          }

          console.log("Code review completed with no findings. Passing the gate.");
          process.exit(0);
          EOF

  sonarqube:
    needs: [changes, test-backend, test-frontend]
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && needs.changes.outputs.doc_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Checkout github-ci
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: jalantechnologies/github-ci
          path: platform

      - name: Download backend coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: src/apps/backend/coverage/

      - name: Download frontend coverage report
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage-report
          path: src/apps/frontend/coverage/

      - name: Rebase frontend coverage paths onto the frontend module
        run: |
          sed -i 's|^SF:src/apps/frontend/|SF:|' src/apps/frontend/coverage/lcov.info

      - name: Verify coverage reports are present and non-empty
        run: |
          for report in src/apps/backend/coverage/coverage.xml src/apps/frontend/coverage/lcov.info; do
            if [ ! -s "$report" ]; then
              echo "::error::Missing or empty coverage report: $report. SonarQube would report no coverage."
              exit 1
            fi
            echo "Found coverage report: $report ($(wc -c < "$report") bytes)"
          done

      - name: Run SonarQube analysis
        id: sonar_analysis
        uses: ./platform/.github/actions/analyze
        continue-on-error: true
        with:
          sonar_host_url: ${{ vars.SONAR_HOST_URL }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          branch: ${{ github.head_ref }}
          branch_base: main
          pull_request_number: ${{ github.event.number }}

      - name: Fetch SonarQube quality gate details
        if: steps.sonar_analysis.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          PROJECT_KEY=$(grep 'sonar.projectKey' sonar-project.properties | cut -d'=' -f2 | tr -d ' ')
          echo "Quality gate status:"
          curl -sf -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}&pullRequest=${PR_NUMBER}" | python3 -m json.tool || true
          echo "New issues:"
          curl -sf -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&pullRequest=${PR_NUMBER}&resolved=false&ps=20" | python3 -m json.tool || true

      - name: Fail unless this run's own analysis passed the gate
        if: steps.sonar_analysis.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          REPORT_TASK_FILE=$(find . -type f -name report-task.txt -path '*.scannerwork*' 2>/dev/null | head -1)
          if [ -z "$REPORT_TASK_FILE" ] || [ ! -f "$REPORT_TASK_FILE" ]; then
            echo "::error::No .scannerwork/report-task.txt was produced, so this commit was never published to SonarQube. Failing to avoid passing an unscanned commit."
            exit 1
          fi
          CE_TASK_ID=$(grep '^ceTaskId=' "$REPORT_TASK_FILE" | cut -d'=' -f2- | tr -d ' \r')
          if [ -z "$CE_TASK_ID" ]; then
            echo "::error::report-task.txt has no ceTaskId; cannot confirm this commit was published. Failing."
            exit 1
          fi

          CE_TASK_STATUS=""
          ANALYSIS_ID=""
          for _ in 1 2 3 4 5 6; do
            CE_RESPONSE=$(curl -sf -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/ce/task?id=${CE_TASK_ID}" || true)
            CE_PARSED=$(printf '%s' "$CE_RESPONSE" | python3 -c '
          import sys, json
          raw = sys.stdin.read().strip()
          if not raw:
              sys.exit(0)
          try:
              t = json.loads(raw)["task"]
          except Exception:
              sys.exit(0)
          print(t.get("status", "") + "|" + t.get("analysisId", ""))
          ')
            CE_TASK_STATUS=${CE_PARSED%%|*}
            ANALYSIS_ID=${CE_PARSED#*|}
            case "$CE_TASK_STATUS" in
              PENDING|IN_PROGRESS) sleep 5 ;;
              *) break ;;
            esac
          done

          if [ "$CE_TASK_STATUS" != "SUCCESS" ] || [ -z "$ANALYSIS_ID" ]; then
            echo "::error::SonarQube compute-engine task for this run is '${CE_TASK_STATUS:-<unknown>}' (not SUCCESS with an analysisId). The current commit was not analysed. Failing."
            exit 1
          fi

          GATE_RESPONSE=$(curl -sf -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}" || true)
          STATUS=$(printf '%s' "$GATE_RESPONSE" | python3 -c '
          import sys, json
          raw = sys.stdin.read().strip()
          if not raw:
              sys.exit(0)
          try:
              print(json.loads(raw)["projectStatus"]["status"])
          except Exception:
              sys.exit(0)
          ')
          echo "This run analysisId=${ANALYSIS_ID} quality gate status: ${STATUS:-<none>}"
          if [ "$STATUS" = "ERROR" ]; then
            echo "::error::SonarQube quality gate for this run's analysis is ERROR. Failing the build."
            exit 1
          elif [ "$STATUS" = "OK" ] || [ "$STATUS" = "NONE" ]; then
            echo "::warning::sonar-scanner reported a failure, but the quality gate for this run's own analysis (${ANALYSIS_ID}) is ${STATUS}. Treating the scanner's non-zero result as a transient/scanner issue and passing."
            exit 0
          else
            echo "::error::Could not determine the quality gate status for this run's analysis (got '${STATUS:-<empty>}'). Failing so a broken query cannot mask a real gate failure."
            exit 1
          fi

  scan:
    needs: changes
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && needs.changes.outputs.doc_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .trivy
          key: trivy-db-v1

      - name: Extract branch name
        id: extract_branch
        run: |
          BRANCH_NAME=$(echo ${{ github.event.pull_request.head.ref }} | sed -e 's/^refs\/heads\///g')
          BRANCH_HASH=$(sha1sum < <(printf '%s' $BRANCH_NAME) | cut -c -15)
          echo "branch_hash=$(echo $BRANCH_HASH)" >> $GITHUB_OUTPUT

      - name: Get changes
        id: changes
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD)
          for file in $CHANGED_FILES; do
            if [[ -f "$file" ]]; then
              mkdir -p "changed_files/$(dirname "$file")"
                cp "$file" "changed_files/$file"
              fi
          done
          echo $CHANGED_FILES
          ls changed_files/
          echo "changed_files=$(echo $CHANGED_FILES)" >> $GITHUB_OUTPUT

      - name: Run Trivy scan on changed files
        id: trivy
        if: steps.changes.outputs.changed_files != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          version: 'v0.69.2'
          trivy-config: trivy.yaml
          scan-type: 'filesystem'
          scan-ref: './changed_files'
          format: 'template'
          template: '@markdown-templates/fs-markdown.tpl'
          output: 'trivy-report.md'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: 1
          cache-dir: .trivy

      - name: Comment PR with audit results
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        if: steps.trivy.outcome == 'failure'
        with:
          token: ${{ secrets.TRIVY_SCAN_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: trivy-report.md

      - name: Get changes in k8s folder and subfolders
        id: iac_changes
        run: |
          # Fetch base branch
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

          # Get all changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD)

          # Initialize filtered variable
          FILTERED_FILES=""
          mkdir -p iac_changed_files/
          # Loop and copy only files in k8s/ or subdirectories
          for file in $CHANGED_FILES; do
            if [[ -f "$file" && "$file" == lib/kube/* ]]; then
              mkdir -p "iac_changed_files/$(dirname "$file")"
              cp "$file" "iac_changed_files/$file"
              FILTERED_FILES="$FILTERED_FILES $file"
            fi
          done

          # Copy core network-policy.yaml for Checkov to detect NetworkPolicy
          # This fixes CKV2_K8S_6 false positives when only deployment files change
          if [ -n "$FILTERED_FILES" ] && [ -f "lib/kube/core/network-policy.yaml" ]; then
            mkdir -p "iac_changed_files/lib/kube/core/"
            cp "lib/kube/core/network-policy.yaml" "iac_changed_files/lib/kube/core/"
          fi

          echo "FILTERED_FILES=$FILTERED_FILES" >> $GITHUB_OUTPUT

      - name: Run Trivy scan on IaC
        if: ${{ steps.iac_changes.outputs.FILTERED_FILES != '' }}
        id: trivy_iac
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          version: 'v0.69.2'
          trivy-config: trivy.yaml
          scan-type: 'config'
          scan-ref: 'iac_changed_files'
          format: 'template'
          template: '@markdown-templates/iac-markdown.tpl'
          output: 'trivy-iac-report.md'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: 1
          cache-dir: .trivy

      - name: Comment PR with audit results
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        if: ${{ steps.iac_changes.outputs.FILTERED_FILES != '' && steps.trivy_iac.outcome == 'failure' }}
        with:
          token: ${{ secrets.TRIVY_SCAN_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: trivy-iac-report.md

      - name: Run Checkov action
        id: checkov
        if: ${{ steps.iac_changes.outputs.FILTERED_FILES != '' }}
        uses: bridgecrewio/checkov-action@a7683e7b72a04503521247973281ec8142e1ac1f
        continue-on-error: true
        with:
          directory: iac_changed_files/
          output_format: 'github_failed_only'
          output_file_path: checkov_result
          quiet: 'true'

      - name: Comment PR with audit results
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        if: ${{ steps.checkov.outcome == 'failure' }}
        with:
          token: ${{ secrets.TRIVY_SCAN_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: checkov_result/results_github_failed_only.md

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell
          sudo apt-get clean
          docker image prune -af
          df -h

      - name: Build Docker image for scanning
        run: |
          docker build -t flask-react-app:${{ steps.extract_branch.outputs.branch_hash }} .

      - name: Run Trivy scan on docker images
        id: trivy_docker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          version: 'v0.69.2'
          trivy-config: trivy.yaml
          scan-type: 'image'
          image-ref: 'flask-react-app:${{ steps.extract_branch.outputs.branch_hash }}'
          format: 'template'
          template: '@markdown-templates/docker-markdown.tpl'
          output: 'trivy-docker-report.md'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: 1
          cache-dir: .trivy

      - name: Check if report contains any real vulnerabilities
        id: vuln_check
        run: |
          # Count how many vulnerabilities are listed in the markdown
          COUNT=$(grep -c "CVE-" trivy-docker-report.md || true)
          echo "vuln_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Comment PR with audit results
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        if: steps.trivy_docker.outcome == 'failure' && hashFiles('trivy-docker-report.md') != '' && steps.vuln_check.outputs.vuln_count != '0'
        with:
          token: ${{ secrets.TRIVY_SCAN_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: trivy-docker-report.md

      - name: Fail job if Trivy found issues
        if: steps.trivy.outcome == 'failure' || steps.trivy_iac.outcome == 'failure' || steps.trivy_docker.outcome == 'failure' || steps.checkov.outcome == 'failure'
        run: |
          echo "❌ Trivy found vulnerabilities — failing the job."
          exit 1

  test-backend:
    needs: changes
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && needs.changes.outputs.doc_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Prepare coverage directory
        run: mkdir -p output

      - name: Run integration tests
        run: docker compose -f docker-compose.test.yml up --exit-code-from app

      - name: Copy coverage artifacts from container
        if: always()
        run: |
          if docker compose -f docker-compose.test.yml ps -q app >/dev/null 2>&1; then
            docker compose -f docker-compose.test.yml cp app:/app/output/coverage.xml output/coverage.xml || echo "coverage.xml not found in app container"
          fi

      - name: Validate coverage excludes test files
        run: |
          if [ -f output/coverage.xml ]; then
            if grep -qE 'filename="[^"]*/(tests/|test_[^"]*\.py|[^"]*_test\.py)' output/coverage.xml; then
              echo "ERROR: Coverage report includes test files. Check .coveragerc configuration."
              echo "Files found:"
              grep -oE 'filename="[^"]*/(tests/|test_[^"]*\.py|[^"]*_test\.py)[^"]*"' output/coverage.xml | head -20
              exit 1
            fi
            echo "Coverage validation passed: no test files in coverage report"
          fi

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v || true

      - name: Fix coverage paths for SonarQube
        run: |
          sed -i \
            -e 's|/app/src/apps/backend/||g' \
            -e 's|<source>/app/src/apps/backend</source>|<source>.</source>|g' \
            output/coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: output/coverage.xml
          retention-days: 1
          if-no-files-found: error

      - name: Coverage report
        id: backend_coverage
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: output/coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '80 90'

      - name: Add coverage PR comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Enforce backend coverage threshold
        if: steps.backend_coverage.outcome == 'failure'
        run: |
          echo "::error::Backend line coverage fell below the enforced floor (see the coverage report above). Add tests to bring it back over the threshold."
          exit 1

  test-frontend:
    needs: changes
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && needs.changes.outputs.doc_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.13.1'

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm-test-frontend
          key: npm-test-frontend-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-test-frontend-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm ci --cache ~/.npm-test-frontend

      - name: Run frontend tests
        run: npm run test:frontend -- --coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: output/frontend-coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

      - name: Coverage report
        id: frontend_coverage
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: output/frontend-coverage/cobertura-coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '35 55'

      - name: Title the frontend coverage comment
        if: always() && hashFiles('code-coverage-results.md') != ''
        run: |
          printf '## Frontend\n\n%s' "$(cat code-coverage-results.md)" > frontend-coverage-results.md

      - name: Add frontend coverage PR comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: frontend-coverage
          recreate: true
          path: frontend-coverage-results.md

      - name: Enforce frontend coverage threshold
        if: steps.frontend_coverage.outcome == 'failure'
        run: |
          echo "::error::Frontend line coverage fell below the enforced floor (see the coverage report above). Add tests to bring it back over the threshold."
          exit 1
